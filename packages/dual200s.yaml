# Complete Levoit Dual 200S (LUH-D301S) device: board, UART and every entity.
# Use it as a remote package, see the README.
#
# Entities are grouped the way Home Assistant shows them on the device page:
# Controls, Sensors, Configuration and Diagnostic.

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # ESP32-SOLO-1C is single core
      CONFIG_FREERTOS_UNICORE: y

external_components:
  - source: github://Ahmed-max/esphome-levoit-humidifier@main
    components: [levoit_humidifier]
    refresh: 0s

uart:
  id: levoit_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

levoit_humidifier:
  id: levoit
  model: DUAL200S

# ---------------------------------------------------------------- Controls

switch:
  - platform: levoit_humidifier
    type: power
    name: Power

  # Configuration
  - platform: levoit_humidifier
    type: display
    name: Display
  - platform: levoit_humidifier
    type: auto_stop
    name: Auto Off

select:
  # Auto / Low / High, the same cycle as the button on the device
  - platform: levoit_humidifier
    type: mode
    name: Mode

number:
  - platform: levoit_humidifier
    type: target_humidity
    name: Target humidity
    mode: slider
  - platform: levoit_humidifier
    type: timer
    name: Timer
    mode: box

# ---------------------------------------------------------------- Sensors

sensor:
  - platform: levoit_humidifier
    type: humidity
    name: Humidity
  - platform: levoit_humidifier
    type: temperature
    name: Temperature

  # Diagnostic
  - platform: wifi_signal
    name: Wi-Fi signal
    entity_category: diagnostic
    update_interval: 60s

binary_sensor:
  - platform: levoit_humidifier
    type: low_water
    name: Low water
  - platform: levoit_humidifier
    type: water_tank_lifted
    name: Water tank lifted
  - platform: levoit_humidifier
    type: mist_active
    name: Mist active
  - platform: levoit_humidifier
    type: auto_stopped
    name: Target humidity reached
  - platform: levoit_humidifier
    type: clean_reminder
    name: Clean tank reminder

  # Diagnostic
  - platform: levoit_humidifier
    type: humidity_high
    name: Humidity high
  - platform: levoit_humidifier
    type: error
    name: Error

# ---------------------------------------------------------------- Configuration

button:
  - platform: levoit_humidifier
    type: reset_clean_reminder
    name: Reset clean tank reminder
  - platform: restart
    name: Restart
    entity_category: config

# ---------------------------------------------------------------- Diagnostic

text_sensor:
  - platform: levoit_humidifier
    type: mcu_version
    name: MCU firmware

